# config/defaults.conf: tracked defaults for image pins, host ports and names.
# scripts/compose.sh loads this file first and .env second, so any value can
# be overridden in .env without editing a compose file. scripts/common.sh,
# scripts/ports-check.sh, the API and e2e/helpers/env.ts read the same names.
# Dependabot cannot parse this file: bump images here by hand, then run
# make verify, make rehearsal and make probe.

# ── Images (arm64; check Architecture after every pull) ───────────────────────
VAULT_ENT_IMAGE=docker.io/hashicorp/vault-enterprise:2.2.1-ent
POSTGRES_IMAGE=docker.io/library/postgres:17.11-alpine
NODE_IMAGE=docker.io/library/node:24-alpine
NGINX_IMAGE=docker.io/library/nginx:1.30.0-alpine
ALPINE_IMAGE=docker.io/library/alpine:3.24.1

# ── Host ports (all published on 127.0.0.1; PostgreSQL is not published) ─────
# In no sibling lab's defaults.conf and not listening on 2026-11-12.
VID_PORT_VAULT_S=19500
VID_PORT_VAULT_1=19501
VID_PORT_VAULT_2=19502
VID_PORT_VAULT_3=19503
VID_PORT_API=14000
VID_PORT_WEB=14001

# ── Vault ─────────────────────────────────────────────────────────────────────
# Every object of the story lives in this namespace (D9).
VID_NAMESPACE=observatory

# ── The lab's OAuth issuer (D12) ──────────────────────────────────────────────
VID_ISSUER=https://issuer.corvid.example
VID_AUDIENCE=https://vault.observatory.example

# ── Evidence (D16) ────────────────────────────────────────────────────────────
# Seconds after issuance before a credential without a matching PostgreSQL
# session counts as Unmatched.
VID_CONSUMPTION_WINDOW=60
# How long the presenter stays signed in to the console without a click.
VID_SESSION_IDLE=14400

# ── Application images (make app-build) ───────────────────────────────────────
VID_IMAGE_PREFIX=localhost/vault-identity
VID_IMAGE_TAG=local
