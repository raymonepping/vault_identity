# compose/app/compose.yaml: the Identity Observatory (prompts 05, 06).
#
#   volume-init  one-shot: the web certificate for nginx (uid 101) and the
#                evidence volume for the API (uid 1000)
#   api          the evidence service: the console token (D14), the issuer key
#                (D12), the workload's AppRole files (D11), the three audit
#                logs and PostgreSQL's jsonlog (read-only), the evidence store
#   web          nginx over TLS 1.3; React console + /api proxy
#
# Every credential is a read-only bind mount that Ansible or gen-certs writes
# in place (gotcha 4). Noor's password is not here: she types it. Images:
# make app-build.

services:
  volume-init:
    image: ${ALPINE_IMAGE}
    container_name: vid-volume_init
    user: "0:0"
    network_mode: none
    entrypoint:
      - /bin/sh
      - -c
      - >-
        install -d -m 0750 -o 101 -g 101 /web-tls &&
        install -m 0644 -o 101 -g 101 /src/vault.crt /web-tls/web.crt &&
        install -m 0600 -o 101 -g 101 /src/vault.key /web-tls/web.key &&
        install -m 0644 -o 101 -g 101 /src/ca-chain.pem /web-tls/ca-chain.pem &&
        chown 1000:1000 /evidence && chmod 0700 /evidence &&
        echo '[volume-init] done'
    volumes:
      - web-tls:/web-tls
      - evidence:/evidence
      - ../../vault-tls:/src:ro
    restart: "no"

  api:
    image: ${VID_IMAGE_PREFIX}/api:${VID_IMAGE_TAG}
    container_name: vid-api
    hostname: api
    # gid 1000 reads the three audit logs (0640).
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      PORT: "3000"
      VAULT_NODES: https://vault-1:8200,https://vault-2:8200,https://vault-3:8200
      VID_NAMESPACE: ${VID_NAMESPACE}
      VID_ISSUER: ${VID_ISSUER}
      VID_AUDIENCE: ${VID_AUDIENCE}
      CONSUMPTION_WINDOW: "${VID_CONSUMPTION_WINDOW}"
      CONSOLE_USER: noor
      CONSOLE_TOKEN_FILE: /run/secrets/vault/console
      ISSUER_KEY_FILE: /run/secrets/issuer/signing.pem
      APPROLE_DIR: /run/secrets/approle/payments-batch
      AUDIT_LOGS: vault-1=/audit/vault-1/audit.log,vault-2=/audit/vault-2/audit.log,vault-3=/audit/vault-3/audit.log
      PG_LOG: /pglog/postgresql.json
      EVIDENCE_DB: /data/evidence.db
      CASES_FILE: /app/config/cases.json
      SESSION_IDLE_SECONDS: "${VID_SESSION_IDLE}"
      CONSOLE_URL: https://localhost:${VID_PORT_WEB}
      NODE_EXTRA_CA_CERTS: /etc/vid/ca-chain.pem
    ports: ["127.0.0.1:${VID_PORT_API}:3000"]
    volumes:
      - ../../vault-tls/ca-chain.pem:/etc/vid/ca-chain.pem:ro
      - ../../.secrets/vault/tokens/console:/run/secrets/vault/console:ro      # D14
      - ../../.secrets/issuer/signing.pem:/run/secrets/issuer/signing.pem:ro   # D12
      - ../../.secrets/approle/payments-batch:/run/secrets/approle/payments-batch:ro  # D11
      - vault-1-audit:/audit/vault-1:ro             # evidence, one file per node
      - vault-2-audit:/audit/vault-2:ro
      - vault-3-audit:/audit/vault-3:ro
      - pg-log:/pglog:ro                            # PostgreSQL's connection log
      - evidence:/data                              # the evidence store (D15)
    mem_limit: 256m
    networks: [default]
    restart: unless-stopped
    depends_on:
      volume-init:
        condition: service_completed_successfully

  web:
    image: ${VID_IMAGE_PREFIX}/web:${VID_IMAGE_TAG}
    container_name: vid-web
    hostname: web
    user: "101:101"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp
    ports: ["127.0.0.1:${VID_PORT_WEB}:8443"]
    volumes:
      - web-tls:/etc/nginx/tls:ro
    networks: [default]
    restart: unless-stopped
    depends_on:
      volume-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

networks:
  default:
    name: vid-internal
    external: true

volumes:
  web-tls: {}
  evidence:
    name: vid-evidence
    labels: { io.vid.data: "true" }
  vault-1-audit:
    external: true
    name: vid-vault_vault-1-audit
  vault-2-audit:
    external: true
    name: vid-vault_vault-2-audit
  vault-3-audit:
    external: true
    name: vid-vault_vault-3-audit
  pg-log:
    external: true
    name: vid-pg_log
